databases:
  - name: riesgo-tributario-db
    databaseName: riesgo_tributario
    user: riesgo
    plan: free

services:
  - type: web
    name: riesgo-tributario-api
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python -m ml.generar_dataset && python -m ml.train"
    startCommand: "python -m scripts.seed_demo && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 wsgi:app"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: riesgo-tributario-db
          property: connectionString
      - key: TARIFA_HORA_SOLES
        value: "35"
      - key: MODELO_ACTIVO
        value: auto
